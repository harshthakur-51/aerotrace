[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aircraft-debugger"
version = "1.3.0"
description = "AeroTrace: inspectable causal diagnosis and replay for selected aircraft systems"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["aircraft_debugger*"]

[tool.setuptools.package-data]
aircraft_debugger = ["assets/*.html"]
